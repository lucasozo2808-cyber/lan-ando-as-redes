<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Lançando as Redes — Rede Metanoia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Anton&family=Kalam:ital,wght@1,700&display=swap');

:root{

  --bg-panel-2: #1e2447;
  --accent: #e3a640;

  --border: #2b3260;

  --danger: #c96a5a;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow-card: 0 14px 34px rgba(3,5,18,0.45), 0 1px 0 rgba(255,255,255,0.03) inset;
  --shadow-soft: 0 6px 16px rgba(3,5,18,0.35);
  --ease: cubic-bezier(.22,.8,.32,1);
}

*{ box-sizing: border-box; }

body{

header{

header .fish{

.topbar{

.achv-grid{

.achv-card{

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// Configuração do projeto Firebase (Lançando as Redes). Essas chaves não são
// segredo: ficam expostas no front-end de qualquer app Firebase. A proteção
// real vem das Regras de Segurança configuradas no console do Firestore.
const firebaseConfig = {
  apiKey: "AIzaSyCInYGlsonTgwoGPANPev0Eehbj_tVDlrI",
  authDomain: "lancando-as-redes-6abde.firebaseapp.com",
  projectId: "lancando-as-redes-6abde",
  storageBucket: "lancando-as-redes-6abde.firebasestorage.app",
  messagingSenderId: "376480483053",
  appId: "1:376480483053:web:4bd7bffba1e77ee02f6ee4",
  measurementId: "G-G6CKN78L0B"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

const DISCIPULADORES = [
  'Lucas Claudino',
  'Erick Martins',
  'Douglas Ferreira',
  'Victor Jesus',
  'Guilherme Andrade',
  'Kleison'
];

// Suporta mais de um login com acesso ao Painel Geral (admin master, vê tudo).
// Para dar acesso de admin master a mais alguém, basta acrescentar o nome aqui.
const ADMIN_NAMES = ['Obreiro ADM', 'ADM'];
const MAX_ALVOS_POR_CATEGORIA = 3;

// Admin por discipulador: basta a pessoa logar com o nome do discipulador
// seguido de " ADM" (ex: "Lucas Claudino ADM") para ter acesso a um painel
// igual ao do obreiro, mas enxergando só o próprio grupo de discípulos.
function matchDiscipuladorAdminName(name){
  const slug = slugKey(name);
  for(const d of DISCIPULADORES){
    if(slug === slugKey(d + ' ADM')) return d;
  }
  return null;
}

const state = {
  name: null,
  discipulador: null,
  targets: null,
  timerSeconds: 0,
  timerRunning: false,
  timerInterval: null,
  activeTab: 'alvos',
  isAdmin: false,
  adminScope: null // null = admin master (vê tudo); string = nome do discipulador (vê só o grupo dele)
};

async function saveDiscipuladorMap(name, discipulador){
  const map = await getJSON('discipulador-map', {});
  map[name] = discipulador;
  await setJSON('discipulador-map', map);
}

function simpleHash(str){
  let hash = 5381;
  for(let i=0;i<str.length;i++){
    hash = ((hash << 5) + hash) + str.charCodeAt(i);
    hash = hash & 0xffffffff;
  }
  return (hash >>> 0).toString(36);
}

// A conta é identificada por uma versão "normalizada" do nome (sem acento,
// sem diferenciar maiúsculas/minúsculas), assim a pessoa nunca perde acesso
// aos seus dados só porque digitou o nome de um jeito levemente diferente
// da primeira vez. O nome exibido no app é sempre o que foi digitado no
// cadastro original.
async function findAccount(name){
  const map = await getJSON('user-credentials', {});
  return map[slugKey(name)] || null; // { hash, displayName } ou null
}
async function saveCredential(name, password){
  const map = await getJSON('user-credentials', {});
  map[slugKey(name)] = { hash: simpleHash(password), displayName: name.trim() };
  await setJSON('user-credentials', map);
}
async function checkCredential(name, password){
  const account = await findAccount(name);
  if(!account) return null;
  return account.hash === simpleHash(password) ? account.displayName : false;
}
// Reseta a senha de uma conta: remove o registro de credencial (mas os dados
// da pessoa, que ficam salvos pelo nome, não são afetados). Na próxima vez
// que a pessoa digitar o nome dela, o app trata como primeiro acesso e pede
// para criar uma senha nova.
async function resetCredential(name){
  const map = await getJSON('user-credentials', {});
  delete map[slugKey(name)];
  await setJSON('user-credentials', map);
}

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

// Toda leitura/escrita de dados do app passa por aqui. Por baixo dos panos
// isso agora é o Firestore (coleção "appdata", um documento por chave), mas
// o resto do app continua chamando getJSON/setJSON exatamente como antes —
// então praticamente nenhuma outra função precisou mudar nessa migração.
async function getJSON(key, fallback){
  try{
    const snap = await getDoc(doc(db, 'kv', key));
    return snap.exists() ? JSON.parse(snap.data().value) : fallback;
  }catch(e){ console.error('firestore get error', key, e); return fallback; }
}
async function setJSON(key, value){
  try{
    await setDoc(doc(db, 'kv', key), { value: JSON.stringify(value) });
    return true;
  }catch(e){ console.error('firestore set error', key, e); return false; }
}
async function deleteKey(key){
  try{
    await deleteDoc(doc(db, 'kv', key));
    return true;
  }catch(e){ console.error('firestore delete error', key, e); return false; }
}

function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function fmtDate(s){
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}
function minToHM(min){
  min = Math.round(min);
  const h = Math.floor(min/60);
  const m = min%60;
  if(h===0) return `${m} min`;
  return `${h}h ${String(m).padStart(2,'0')}min`;
}
function fmtClock(totalSeconds){
  const h = String(Math.floor(totalSeconds/3600)).padStart(2,'0');
  const m = String(Math.floor((totalSeconds%3600)/60)).padStart(2,'0');
  const s = String(totalSeconds%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}

function slugKey(str){
  return (str || '')
    .trim()
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, '_')
    .replace(/[^a-z0-9_\-]/g, '');
}

async function loadTargets(name){
  return await getJSON('targets:'+slugKey(name), null);
}
async function saveTargets(name, data){
  const ok = await setJSON('targets:'+slugKey(name), data);
  if(ok){
    const index = await getJSON('targets-index', []);
    if(!index.includes(name)){
      index.push(name);
      await setJSON('targets-index', index);
    }
  }
  return ok;
}

async function loadAllTargets(){
  const names = await getJSON('targets-index', []);
  const discipuladorMap = await getJSON('discipulador-map', {});
  const items = await Promise.all(names.map(async n => {
    const t = await getJSON('targets:'+slugKey(n), null);
    return t ? { name: n, discipulador: discipuladorMap[n] || '', pessoas: t.pessoas || [], conquista: t.conquista || [], ovelhaPerdida: t.ovelhaPerdida || [] } : null;
  }));
  return items.filter(Boolean).sort((a,b) => a.name.localeCompare(b.name, 'pt-BR'));
}

async function getGroupGrandTotal(){
  const totals = await getJSON('prayer-totals', {});
  return Object.values(totals).reduce((a,b)=>a+b,0);
}

async function resetAllPrayerHours(){
  try{
    const dates = await getJSON('prayer-dates', []);
    for(const d of dates){
      await deleteKey('prayer-stats:'+d);
    }
    await deleteKey('prayer-totals');
    await deleteKey('prayer-dates');
    return true;
  }catch(e){ console.error('reset error', e); return false; }
}

async function addPrayerMinutes(name, minutes){
  const dateStr = todayStr();
  const daily = await getJSON('prayer-stats:'+dateStr, {});
  daily[name] = (daily[name]||0) + minutes;
  await setJSON('prayer-stats:'+dateStr, daily);

  const totals = await getJSON('prayer-totals', {});
  totals[name] = (totals[name]||0) + minutes;
  await setJSON('prayer-totals', totals);

  const dates = await getJSON('prayer-dates', []);
  if(!dates.includes(dateStr)){
    dates.push(dateStr); dates.sort();
    await setJSON('prayer-dates', dates);
  }
  return daily[name];
}

// de 30min). Não mexe no histórico diário — só corrige o total mostrado nos

async function setPrayerTotal(name, minutes){
  const totals = await getJSON('prayer-totals', {});
  totals[name] = Math.max(0, Math.round(minutes));
  await setJSON('prayer-totals', totals);
  return totals[name];
}

function compressImage(file, maxWidth){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler o arquivo'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Falha ao carregar a imagem'));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function addAchievement(name, discipulador, target, caption, photoDataUrl){

async function loadDashboard(name){
  const dateStr = todayStr();
  const daily = await getJSON('prayer-stats:'+dateStr, {});
  const totals = await getJSON('prayer-totals', {});
  const discipuladorMap = await getJSON('discipulador-map', {});
  const todayGroupTotal = Object.values(daily).reduce((a,b)=>a+b,0);
  const yourToday = daily[name] || 0;
  const yourTotal = totals[name] || 0;
  const grandTotal = Object.values(totals).reduce((a,b)=>a+b,0);
  const ranking = Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const participantsToday = Object.keys(daily).length;

  const groupTotals = {};
  const groupCounts = {};
  Object.entries(totals).forEach(([personName, minutes]) => {
    const group = discipuladorMap[personName] || 'Sem discipulador informado';
    groupTotals[group] = (groupTotals[group]||0) + minutes;
    groupCounts[group] = (groupCounts[group]||0) + 1;
  });
  const groupRanking = Object.entries(groupTotals).sort((a,b)=>b[1]-a[1]);

  return { todayGroupTotal, yourToday, yourTotal, grandTotal, ranking, participantsToday, discipuladorMap, groupRanking, groupCounts };
}

async function loadAdminOverview(){
  const totals = await getJSON('prayer-totals', {});
  const discipuladorMap = await getJSON('discipulador-map', {});
  const targetItems = await loadAllTargets();
  const achievements = await loadAchievements(9999);

  const achievementCounts = {};
  achievements.forEach(a => { achievementCounts[a.name] = (achievementCounts[a.name]||0) + 1; });

  const namesSet = new Set([
    ...Object.keys(totals),
    ...Object.keys(discipuladorMap),
    ...targetItems.map(t => t.name)
  ]);

  const targetsByName = {};
  targetItems.forEach(t => { targetsByName[t.name] = t; });

  const people = Array.from(namesSet).map(name => {
    const t = targetsByName[name] || { pessoas: [], conquista: [], ovelhaPerdida: [] };
    return {
      name,
      discipulador: discipuladorMap[name] || '',
      totalMinutes: totals[name] || 0,
      achievementsCount: achievementCounts[name] || 0,
      pessoas: t.pessoas || [],
      conquista: t.conquista || [],
      ovelhaPerdida: t.ovelhaPerdida || []
    };
  }).sort((a,b) => b.totalMinutes - a.totalMinutes);

  const grandTotal = Object.values(totals).reduce((a,b)=>a+b,0);
  let totalTargets = 0;
  people.forEach(p => { totalTargets += p.pessoas.length + p.conquista.length + p.ovelhaPerdida.length; });

  return { people, grandTotal, totalTargets, totalAchievements: achievements.length };
}

const TARGET_CATEGORIES = [
  { key: 'pessoas', label: 'Pessoas', groupTitle: 'Pessoas', addLabel: '+ adicionar pessoa', placeholder: 'Nome da pessoa', chipClass: 'pessoa' },
  { key: 'conquista', label: 'Conquista', groupTitle: 'Conquista', addLabel: '+ adicionar alvo de conquista', placeholder: 'Nome do alvo', chipClass: 'conquista' },
  { key: 'ovelhaPerdida', label: 'Ovelha Perdida', groupTitle: 'Ovelha Perdida', addLabel: '+ adicionar pessoa', placeholder: 'Nome da pessoa', chipClass: 'perdido' }
];

// ---- Export / Import de alvos em planilha (.xlsx) ----
// Formato de linha compartilhado entre exportação, modelo e importação:
// Nome da Pessoa | Discipulador | Tipo de Alvo | Alvo | Anônimo (Sim/Não)

function normalizeLabel(s){
  return String(s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().trim();
}

function targetsToExportRows(items, opts){
  const anonymize = opts && opts.anonymize;
  const rows = [];
  items.forEach(item => {
    TARGET_CATEGORIES.forEach(cat => {
      (item[cat.key] || []).forEach(t => rows.push({
        'Nome da Pessoa': (t.anonimo && anonymize) ? 'Anônimo' : item.name,
        'Discipulador': (t.anonimo && anonymize) ? '' : (item.discipulador || ''),
        'Tipo de Alvo': cat.label,
        'Alvo': t.text,
        'Anônimo': t.anonimo ? 'Sim' : 'Não'
      }));
    });
  });
  return rows;
}

function downloadTargetsWorkbook(rows, filename){
  if(typeof XLSX === 'undefined'){
    alert('A biblioteca de planilhas não carregou. Verifique sua conexão e tente novamente.');
    return false;
  }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:24},{wch:22},{wch:16},{wch:30},{wch:10}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Alvos de Oração');
  XLSX.writeFile(wb, filename);
  return true;
}

    { 'Nome da Pessoa': 'Maria Silva', 'Discipulador': d, 'Tipo de Alvo': 'Ovelha Perdida', 'Alvo': 'Pedro (ex-membro)', 'Anônimo': 'Não' }
  ];
}

// Lê linhas já extraídas de uma planilha (via XLSX.utils.sheet_to_json) e grava
// os alvos por pessoa. Cada pessoa citada tem suas 3 categorias totalmente
// substituídas pelo conteúdo da planilha (linhas ausentes viram categoria vazia).
async function importTargetsFromRows(rows){
  const catByLabel = {};
  TARGET_CATEGORIES.forEach(cat => { catByLabel[normalizeLabel(cat.label)] = cat.key; });

  const people = {};
  let invalidRows = 0;
  let truncated = 0;

  rows.forEach(row => {
    const name = String(row['Nome da Pessoa'] || '').trim();
    const alvo = String(row['Alvo'] || '').trim();
    const catKey = catByLabel[normalizeLabel(row['Tipo de Alvo'])];
    if(!name || normalizeLabel(name) === 'anonimo' || !alvo || !catKey){
      invalidRows++;
      return;
    }
    const anonimo = normalizeLabel(row['Anônimo']).startsWith('s');
    const discipulador = String(row['Discipulador'] || '').trim();
    const slug = slugKey(name);
    if(!people[slug]) people[slug] = { displayName: name, discipulador: '', pessoas: [], conquista: [], ovelhaPerdida: [] };
    if(discipulador) people[slug].discipulador = discipulador;
    if(people[slug][catKey].length >= MAX_ALVOS_POR_CATEGORIA){
      truncated++;
      return;
    }
    people[slug][catKey].push({ text: alvo, anonimo });
  });

  const entries = Object.values(people);
  for(const p of entries){
    await saveTargets(p.displayName, { pessoas: p.pessoas, conquista: p.conquista, ovelhaPerdida: p.ovelhaPerdida });
    if(p.discipulador) await saveDiscipuladorMap(p.displayName, p.discipulador);
  }

  return { peopleCount: entries.length, invalidRows, truncated };
}

async function handleTargetsImportFile(file, msgEl, onDone){
  msgEl.innerHTML = `<div class="loading">Lendo planilha...</div>`;
  try{
    if(typeof XLSX === 'undefined'){
      msgEl.innerHTML = `<div class="msg err">A biblioteca de planilhas não carregou. Verifique sua conexão e tente novamente.</div>`;
      return;
    }
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    if(!rows.length){
      msgEl.innerHTML = `<div class="msg err">A planilha está vazia ou não pôde ser lida.</div>`;
      return;
    }
    const result = await importTargetsFromRows(rows);
    if(result.peopleCount === 0){
      msgEl.innerHTML = `<div class="msg err">Nenhuma linha válida encontrada. Confira se a planilha segue o modelo (colunas Nome da Pessoa, Discipulador, Tipo de Alvo, Alvo, Anônimo).</div>`;
      return;
    }
    let text = `${result.peopleCount} pessoa${result.peopleCount===1?'':'s'} importada${result.peopleCount===1?'':'s'}/atualizada${result.peopleCount===1?'':'s'}.`;
    if(result.truncated) text += ` ${result.truncated} alvo(s) ignorado(s) por ultrapassar o limite de ${MAX_ALVOS_POR_CATEGORIA} por categoria.`;
    if(result.invalidRows) text += ` ${result.invalidRows} linha(s) inválida(s) ignorada(s).`;
    msgEl.innerHTML = `<div class="msg ok">${text}</div>`;
    if(onDone) await onDone();
  }catch(err){
    console.error('import error', err);
    msgEl.innerHTML = `<div class="msg err">Não foi possível importar essa planilha. Confira se o arquivo segue o modelo.</div>`;
  }
}

// ---- Backup Completo (Usuários/Senhas + Alvos + Tempo de Oração + Conquistas) ----
// Objetivo: se o site cair/for perdido, essa planilha permite recriar tudo em
// um site novo. Guarda a senha como HASH (nunca em texto puro) — ao restaurar,
// o hash volta exatamente igual, então cada pessoa continua entrando com a
// MESMA senha de antes, sem que ninguém consiga ler a senha real na planilha.
// Fotos de testemunho não entram no backup (ficariam pesadas demais para a
// planilha); só o texto do testemunho é preservado.

async function buildFullBackupData(){
  const credMap = await getJSON('user-credentials', {});
  const discipMap = await getJSON('discipulador-map', {});
  const totals = await getJSON('prayer-totals', {});
  const targetItems = await loadAllTargets();
  const achievements = await loadAchievements(9999);

  const usersRows = Object.values(credMap).map(acc => ({
    'Nome': acc.displayName,
    'Senha (hash)': acc.hash,
    'Discipulador': discipMap[acc.displayName] || ''
  }));

  const targetsRows = targetsToExportRows(targetItems, { anonymize: false });

  const prayerRows = Object.entries(totals).map(([nome, minutos]) => ({
    'Nome': nome,
    'Total (minutos)': minutos,
    'Total (h:min)': minToHM(minutos)
  }));

  const achvRows = achievements.map(a => ({
    'Nome': a.name,
    'Discipulador': a.discipulador || '',
    'Alvo Conquistado': a.target,
    'Testemunho': a.caption || '',
    'Data': a.date
  }));

  return { usersRows, targetsRows, prayerRows, achvRows };
}

function downloadFullBackupWorkbook(data, filename){
  if(typeof XLSX === 'undefined'){
    alert('A biblioteca de planilhas não carregou. Verifique sua conexão e tente novamente.');
    return false;
  }
  const wb = XLSX.utils.book_new();

  const wsUsers = XLSX.utils.json_to_sheet(data.usersRows);
  wsUsers['!cols'] = [{wch:24},{wch:32},{wch:22}];
  XLSX.utils.book_append_sheet(wb, wsUsers, 'Usuarios');

  const wsTargets = XLSX.utils.json_to_sheet(data.targetsRows);
  wsTargets['!cols'] = [{wch:24},{wch:22},{wch:16},{wch:30},{wch:10}];
  XLSX.utils.book_append_sheet(wb, wsTargets, 'Alvos de Oracao');

  const wsPrayer = XLSX.utils.json_to_sheet(data.prayerRows);
  wsPrayer['!cols'] = [{wch:24},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsPrayer, 'Tempo de Oracao');

  const wsAchv = XLSX.utils.json_to_sheet(data.achvRows);
  wsAchv['!cols'] = [{wch:24},{wch:22},{wch:30},{wch:40},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsAchv, 'Conquistas');

  XLSX.writeFile(wb, filename);
  return true;
}

async function restoreFullBackup(workbook){
  const result = { users: 0, targets: 0, prayerEntries: 0, achievements: 0 };

  if(workbook.Sheets['Usuarios']){
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets['Usuarios'], { defval: '' });
    const credMap = await getJSON('user-credentials', {});
    const discipMap = await getJSON('discipulador-map', {});
    rows.forEach(r => {
      const nome = String(r['Nome'] || '').trim();
      const hash = String(r['Senha (hash)'] || '').trim();
      const discipulador = String(r['Discipulador'] || '').trim();
      if(!nome || !hash) return;
      credMap[slugKey(nome)] = { hash, displayName: nome };
      if(discipulador) discipMap[nome] = discipulador;
      result.users++;
    });
    await setJSON('user-credentials', credMap);
    await setJSON('discipulador-map', discipMap);
  }

  if(workbook.Sheets['Alvos de Oracao']){
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets['Alvos de Oracao'], { defval: '' });
    if(rows.length){
      const r2 = await importTargetsFromRows(rows);
      result.targets = r2.peopleCount;
    }
  }

  if(workbook.Sheets['Tempo de Oracao']){
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets['Tempo de Oracao'], { defval: '' });
    const totals = await getJSON('prayer-totals', {});
    rows.forEach(r => {
      const nome = String(r['Nome'] || '').trim();
      const minutos = Number(r['Total (minutos)']) || 0;
      if(!nome) return;
      totals[nome] = minutos;
      result.prayerEntries++;
    });
    await setJSON('prayer-totals', totals);
  }

  if(workbook.Sheets['Conquistas']){
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets['Conquistas'], { defval: '' });
    const ids = await getJSON('achievement-ids', []);
    for(const r of rows){
      const nome = String(r['Nome'] || '').trim();
      const alvo = String(r['Alvo Conquistado'] || '').trim();
      if(!nome || !alvo) continue;
      const id = 'restaurado-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
      const achv = {
        id, name: nome,
        discipulador: String(r['Discipulador'] || '').trim(),
        target: alvo,
        caption: String(r['Testemunho'] || '').trim(),
        photo: null,
        date: String(r['Data'] || '').trim() || todayStr()
      };
      await setJSON('achievement:' + id, achv);
      ids.unshift(id);
      result.achievements++;
    }
    await setJSON('achievement-ids', ids);
  }

  return result;
}

  const box = el(`

      <div class="row" style="flex-wrap:wrap">
        <button class="btn-primary btn-small" id="fullBackupBtn" type="button">Baixar backup completo (.xlsx)</button>

      </div>
      <p class="sub" style="margin:8px 0 0; font-size:12px;">Atenção: restaurar substitui senha, alvos e totais de cada pessoa que aparecer na planilha.</p>
      <div id="fullBackupMsg"></div>
    </div>
  `);

  box.querySelector('#fullBackupBtn').addEventListener('click', async () => {
    const btn = box.querySelector('#fullBackupBtn');
    btn.disabled = true; btn.textContent = 'Gerando...';
    try{
      const data = await buildFullBackupData();
      downloadFullBackupWorkbook(data, `backup-completo-lancando-as-redes-${todayStr()}.xlsx`);
    } finally {
      btn.disabled = false; btn.textContent = 'Baixar backup completo (.xlsx)';
    }
  });

  box.querySelector('#fullRestoreBtn').addEventListener('click', async () => {
    const fileInput = box.querySelector('#fullRestoreFile');
    const msgEl = box.querySelector('#fullBackupMsg');
    const file = fileInput.files[0];
    if(!file){
      msgEl.innerHTML = `<div class="msg err">Selecione um arquivo .xlsx de backup para restaurar.</div>`;

    }

    const btn = box.querySelector('#fullRestoreBtn');
    btn.disabled = true; btn.textContent = 'Restaurando...';
    msgEl.innerHTML = `<div class="loading">Restaurando backup...</div>`;
    try{

        msgEl.innerHTML = `<div class="msg err">A biblioteca de planilhas não carregou. Verifique sua conexão e tente novamente.</div>`;

      const workbook = XLSX.read(buf, { type: 'array' });
      const result = await restoreFullBackup(workbook);
      msgEl.innerHTML = `<div class="msg ok">Restaurado: ${result.users} usuário(s), ${result.targets} pessoa(s) com alvos, ${result.prayerEntries} registro(s) de tempo, ${result.achievements} conquista(s).</div>`;
      fileInput.value = '';
      render();
    }catch(err){
      console.error('restore error', err);
      msgEl.innerHTML = `<div class="msg err">Não foi possível restaurar esse backup. Confira se é o arquivo correto.</div>`;
    } finally {
      btn.disabled = false; btn.textContent = 'Restaurar';
    }
  });

  return box;
}

function renderTargetsCard(){
  const existing = state.targets || { pessoas: [], conquista: [], ovelhaPerdida: [] };
  const card = el(`
    <div class="card">
      <h2>Meus Alvos de Oração</h2>
      <p class="sub">Organize seus alvos por Pessoas, Conquista e Ovelha Perdida — até ${MAX_ALVOS_POR_CATEGORIA} alvos em cada categoria. Marque "Anônimo" para o alvo aparecer no grupo sem o seu nome.</p>
      ${TARGET_CATEGORIES.map(cat => `
        <div id="group_${cat.key}" class="target-group">
          <h3>${cat.label}</h3>
        </div>
        <button class="add-link" data-add="${cat.key}">${cat.addLabel}</button>
        <p class="sub" id="limit_${cat.key}" style="margin:2px 0 0; font-size:12px;"></p>
      `).join('')}
      <div style="margin-top:22px">
        <button class="btn-primary" id="saveTargetsBtn">Salvar meus alvos</button>
      </div>
      <div id="targetsMsg"></div>
    </div>
  `);

  const data = {};
  TARGET_CATEGORIES.forEach(cat => {
    const rows = existing[cat.key] && existing[cat.key].length ? existing[cat.key] : [{ text: '', anonimo: false }];
    data[cat.key] = rows.map(r => (typeof r === 'string') ? { text: r, anonimo: false } : { text: r.text || '', anonimo: !!r.anonimo });
  });

  function renderGroup(key){
    const cat = TARGET_CATEGORIES.find(c => c.key === key);
    const groupEl = card.querySelector('#group_' + key);
    groupEl.querySelectorAll('.row').forEach(r=>r.remove());
    data[key].forEach((item, idx) => {
      const row = el(`
        <div class="row">
          <input type="text" value="${escapeHtml(item.text)}" placeholder="${cat.placeholder}" />
          <label class="anon-toggle">
            <input type="checkbox" ${item.anonimo ? 'checked' : ''} data-anon="${key}:${idx}" />
            Anônimo
          </label>
          ${data[key].length > 1 ? `<button class="btn-ghost btn-small" data-remove="${key}:${idx}">remover</button>` : ''}
        </div>
      `);
      row.querySelector('input[type="text"]').addEventListener('input', e => { data[key][idx].text = e.target.value; });
      row.querySelector('input[type="checkbox"]').addEventListener('change', e => { data[key][idx].anonimo = e.target.checked; });
      groupEl.appendChild(row);
    });

    const addBtn = card.querySelector(`[data-add="${key}"]`);
    const limitMsg = card.querySelector('#limit_' + key);
    const atLimit = data[key].length >= MAX_ALVOS_POR_CATEGORIA;
    addBtn.classList.toggle('hidden', atLimit);
    limitMsg.textContent = atLimit ? `Limite de ${MAX_ALVOS_POR_CATEGORIA} alvos nesta categoria atingido.` : '';
  }
  TARGET_CATEGORIES.forEach(cat => renderGroup(cat.key));

  card.addEventListener('click', (e) => {
    if(e.target.dataset.add){
      const key = e.target.dataset.add;
      if(data[key].length >= MAX_ALVOS_POR_CATEGORIA) return;
      data[key].push({ text: '', anonimo: false });
      renderGroup(key);
    }
    if(e.target.dataset.remove){
      const [key, idx] = e.target.dataset.remove.split(':');
      data[key].splice(Number(idx),1);
      renderGroup(key);
    }
  });

  card.querySelector('#saveTargetsBtn').addEventListener('click', async () => {
    const payload = {};
    let total = 0;
    TARGET_CATEGORIES.forEach(cat => {
      payload[cat.key] = data[cat.key]
        .map(item => ({ text: item.text.trim(), anonimo: !!item.anonimo }))
        .filter(item => item.text)
        .slice(0, MAX_ALVOS_POR_CATEGORIA);
      total += payload[cat.key].length;
    });
    const msgEl = card.querySelector('#targetsMsg');
    if(total < 1){
      msgEl.innerHTML = `<div class="msg err">Informe pelo menos 1 alvo em alguma das categorias.</div>`;
      return;
    }
    const btn = card.querySelector('#saveTargetsBtn');
    btn.disabled = true; btn.textContent = 'Salvando...';
    const ok = await saveTargets(state.name, payload);
    btn.disabled = false; btn.textContent = 'Salvar meus alvos';
    if(ok){
      state.targets = payload;
      msgEl.innerHTML = `<div class="msg ok">Alvos salvos com sucesso.</div>`;
    } else {
      msgEl.innerHTML = `<div class="msg err">Não foi possível salvar agora. Verifique sua internet e tente novamente.</div>`;
    }
  });

  return card;
}

function renderAllTargetsCard(){
  const card = el(`
    <div class="card">
      <h2>Todos os Alvos de Oração</h2>
      <p class="sub">Lista consolidada de Pessoas, Conquista e Ovelha Perdida cadastrados pelo grupo. Alvos marcados como anônimos aparecem sem o nome de quem registrou.</p>
      <button class="btn-primary" id="exportSheetBtn" style="margin-bottom:16px">Gerar planilha completa (.xlsx)</button>
      <input type="text" id="allTargetsSearch" placeholder="Buscar por nome do alvo ou da pessoa..." style="margin-bottom:16px" />
      <div id="allTargetsBody"><div class="loading">Carregando alvos...</div></div>
    </div>
  `);

  let allItems = [];

  function attribution(r){
    if(r.anonimo) return `<span style="font-style:italic">Anônimo</span>`;
    return `${escapeHtml(r.name)}${r.discipulador ? ' · '+escapeHtml(r.discipulador) : ''}`;
  }

  function renderLists(filter){
    const q = (filter || '').trim().toLowerCase();
    const rowsByCat = {};
    TARGET_CATEGORIES.forEach(cat => { rowsByCat[cat.key] = []; });

    allItems.forEach(item => {
      TARGET_CATEGORIES.forEach(cat => {
        (item[cat.key] || []).forEach(t => {
          if(!q || t.text.toLowerCase().includes(q) || item.name.toLowerCase().includes(q)){
            rowsByCat[cat.key].push({ target: t.text, anonimo: !!t.anonimo, name: item.name, discipulador: item.discipulador });
          }
        });
      });
    });

    const totalRows = TARGET_CATEGORIES.reduce((sum, cat) => sum + rowsByCat[cat.key].length, 0);
    const body = card.querySelector('#allTargetsBody');
    body.innerHTML = `
      <p class="sub" style="margin:0 0 6px">${allItems.length} pessoa${allItems.length===1?'':'s'} cadastrada${allItems.length===1?'':'s'} · ${totalRows} alvo${totalRows===1?'':'s'} no total</p>
      ${TARGET_CATEGORIES.map(cat => `
        <div class="target-group" style="margin-top:20px">
          <h3>${cat.label} (${rowsByCat[cat.key].length})</h3>
          <table>
            <tbody>
              ${rowsByCat[cat.key].map(r => `
                <tr>
                  <td>${escapeHtml(r.target)}</td>
                  <td style="color:var(--text-muted); font-size:12px; text-align:right">${attribution(r)}</td>
                </tr>
              `).join('') || '<tr><td>Nenhum alvo encontrado.</td></tr>'}
            </tbody>
          </table>
        </div>
      `).join('')}
    `;
  }

  loadAllTargets().then(items => {
    allItems = items;
    renderLists('');
  }).catch(() => {
    card.querySelector('#allTargetsBody').innerHTML = `<div class="msg err">Não foi possível carregar os alvos agora.</div>`;
  });

  card.querySelector('#allTargetsSearch').addEventListener('input', e => renderLists(e.target.value));

  card.querySelector('#exportSheetBtn').addEventListener('click', () => {
    if(!allItems.length){
      alert('Ainda não há alvos cadastrados para exportar.');
      return;
    }
    downloadTargetsWorkbook(targetsToExportRows(allItems, { anonymize: true }), 'alvos-lancando-as-redes.xlsx');
  });

  return card;
}

function renderPanelCard(){
  const card = el(`
    <div class="card">
      <h2>Painel Geral</h2>
      <p class="sub">Somatório automático do tempo de oração de todos os participantes.</p>
      <div id="panelBody"><div class="loading">Carregando estatísticas...</div></div>
    </div>
  `);

  loadDashboard(state.name).then(d => {
    const body = card.querySelector('#panelBody');
    body.innerHTML = `
      <div class="stats-grid">
        <div class="stat-box">
          <div class="num">${minToHM(d.todayGroupTotal)}</div>
          <div class="lbl">Total do grupo hoje (${d.participantsToday} pessoa${d.participantsToday===1?'':'s'})</div>
        </div>
        <div class="stat-box">
          <div class="num">${minToHM(d.yourToday)}</div>
          <div class="lbl">Seu total hoje</div>
        </div>
        <div class="stat-box">
          <div class="num">${minToHM(d.yourTotal)}</div>
          <div class="lbl">Seu total geral</div>
        </div>
        <div class="stat-box">
          <div class="num">${minToHM(d.grandTotal)}</div>
          <div class="lbl">Total geral do grupo</div>
        </div>
      </div>
      <table>
        <thead><tr><th>Participante</th><th>Tempo total</th></tr></thead>
        <tbody>
          ${d.ranking.map(([name, min]) => `
            <tr>
              <td class="${name===state.name ? 'rank-you' : 'rank-name'}">${escapeHtml(name)}${name===state.name ? ' (você)' : ''}${d.discipuladorMap[name] ? `<br><span style="color:var(--text-muted); font-size:11px;">${escapeHtml(d.discipuladorMap[name])}</span>` : ''}</td>
              <td>${minToHM(min)}</td>
            </tr>
          `).join('') || '<tr><td colspan="2">Ainda não há registros.</td></tr>'}
        </tbody>
      </table>

      <div class="divider-text">ranking por discipulador</div>
      <table>
        <thead><tr><th>Discipulador</th><th>Participantes</th><th>Tempo total</th></tr></thead>
        <tbody>
          ${d.groupRanking.map(([group, min]) => `
            <tr>
              <td class="${group===state.discipulador ? 'rank-you' : 'rank-name'}">${escapeHtml(group)}${group===state.discipulador ? ' (seu grupo)' : ''}</td>
              <td>${d.groupCounts[group]}</td>
              <td>${minToHM(min)}</td>
            </tr>
          `).join('') || '<tr><td colspan="3">Ainda não há registros.</td></tr>'}
        </tbody>
      </table>
      <div style="margin-top:16px; text-align:right">
        <button class="btn-ghost btn-small" id="refreshBtn">Atualizar</button>
      </div>
    `;
    body.querySelector('#refreshBtn').addEventListener('click', () => render());
  }).catch(() => {
    card.querySelector('#panelBody').innerHTML = `<div class="msg err">Não foi possível carregar o painel agora.</div>`;
  });

  return card;
}

function renderAdminPanel(){
  const scope = state.adminScope; // null = admin master (vê tudo); string = só esse discipulador

  const card = el(`
    <div class="card">
      <h2>${scope ? `Painel do Discipulador` : 'Painel do Obreiro'}</h2>
      <p class="sub">${scope
        ? `Você está vendo apenas os discípulos de <b>${escapeHtml(scope)}</b>. Alvos marcados como anônimos para o grupo aparecem aqui com o nome real, para acompanhamento pastoral.`
        : 'Resumo geral de todas as pessoas, alvos e tempo de oração. Alvos marcados como anônimos para o grupo aparecem aqui com o nome real, para acompanhamento pastoral.'}</p>
      <div id="adminExportImportSlot"></div>
      ${scope ? '' : `
      <div class="row" style="margin-bottom:6px">
        <select id="discipuladorFilter">
          <option value="">Todos os discipuladores</option>
          ${DISCIPULADORES.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('')}
          <option value="__sem__">Sem discipulador informado</option>
        </select>
      </div>`}
      <input type="text" id="adminSearch" placeholder="Buscar por nome da pessoa ou do alvo..." style="margin-bottom:16px" />
      <div id="adminBody"><div class="loading">Carregando painel...</div></div>
    </div>
  `);

  // Backup completo (usuários/senhas de todo mundo) só faz sentido pro admin master.
  if(!scope){
    card.querySelector('#adminExportImportSlot').appendChild(renderFullBackupBox());
  }

  card.querySelector('#adminExportImportSlot').appendChild(
    renderTargetsExportImport(
      async () => {
        const items = await loadAllTargets();
        const filtered = scope ? items.filter(t => t.discipulador === scope) : items;
        return targetsToExportRows(filtered, { anonymize: false });
      },
      scope ? `alvos-${slugKey(scope)}.xlsx` : 'alvos-lancando-as-redes.xlsx'
    )
  );

  let overview = null;

  function personMatchesFilter(p, discFilter){
    if(scope) return p.discipulador === scope;
    if(!discFilter) return true;
    if(discFilter === '__sem__') return !p.discipulador;
    return p.discipulador === discFilter;
  }

  function personMatchesSearch(p, q){
    if(!q) return true;
    if(p.name.toLowerCase().includes(q)) return true;
    return [...p.pessoas, ...p.conquista, ...p.ovelhaPerdida].some(t => t.text.toLowerCase().includes(q));
  }

  function targetsHtml(items, cls){
    if(!items.length) return `<span style="color:var(--text-muted); font-size:12px;">—</span>`;
    return `<div class="chips" style="margin-top:4px">${items.map(t =>
      `<span class="chip ${cls}${t.anonimo ? ' is-anon' : ''}">${escapeHtml(t.text)}${t.anonimo ? '<span class="anon-tag">anônimo p/ grupo</span>' : ''}</span>`
    ).join('')}</div>`;
  }

  function renderBody(){
    const discFilterEl = card.querySelector('#discipuladorFilter');
    const discFilter = discFilterEl ? discFilterEl.value : '';
    const q = card.querySelector('#adminSearch').value.trim().toLowerCase();
    const people = overview.people.filter(p => personMatchesFilter(p, discFilter) && personMatchesSearch(p, q));

    const filteredMinutes = people.reduce((a,p)=>a+p.totalMinutes,0);
    const filteredTargets = people.reduce((a,p)=>a+p.pessoas.length+p.conquista.length+p.ovelhaPerdida.length,0);
    const filteredAchievements = people.reduce((a,p)=>a+p.achievementsCount,0);

    const body = card.querySelector('#adminBody');
    body.innerHTML = `
      <div class="stats-grid">
        <div class="stat-box">
          <div class="num">${people.length}</div>
          <div class="lbl">Pessoas (nesta seleção)</div>
        </div>
        <div class="stat-box">
          <div class="num">${minToHM(filteredMinutes)}</div>
          <div class="lbl">Tempo total de oração</div>
        </div>
        <div class="stat-box">
          <div class="num">${filteredTargets}</div>
          <div class="lbl">Alvos cadastrados</div>
        </div>
        <div class="stat-box">
          <div class="num">${filteredAchievements}</div>
          <div class="lbl">Conquistas publicadas</div>
        </div>
      </div>

      ${people.map(p => `
        <div class="target-group" style="border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px 18px; margin-bottom:14px; background: var(--bg-panel-2); transition: border-color 0.2s;">
          <h3 style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
            <span>${escapeHtml(p.name)}</span>
            <span style="font-size:12px; color:var(--text-muted); font-weight:500;">${minToHM(p.totalMinutes)} · ${p.achievementsCount} conquista${p.achievementsCount===1?'':'s'}</span>
          </h3>
          <p class="sub" style="margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
            <span>${p.discipulador ? escapeHtml(p.discipulador) : 'Sem discipulador informado'}</span>
            <span style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="btn-ghost btn-small" data-adjust="${escapeHtml(p.name)}">Ajustar tempo</button>
              <button class="btn-ghost btn-small" data-reset="${escapeHtml(p.name)}">Resetar senha</button>
            </span>
          </p>
          <p class="sub" style="margin:0 0 2px; font-size:12px;">Pessoas</p>
          ${targetsHtml(p.pessoas, 'pessoa')}
          <p class="sub" style="margin:10px 0 2px; font-size:12px;">Conquista</p>
          ${targetsHtml(p.conquista, 'conquista')}
          <p class="sub" style="margin:10px 0 2px; font-size:12px;">Ovelha Perdida</p>
          ${targetsHtml(p.ovelhaPerdida, 'perdido')}
        </div>
      `).join('') || '<p class="sub">Ninguém encontrado com esse filtro.</p>'}
    `;

    body.querySelectorAll('[data-adjust]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const name = btn.dataset.adjust;
        const person = people.find(p => p.name === name);
        const current = person ? person.totalMinutes : 0;
        const input = prompt(`Novo tempo TOTAL de oração de ${name} (em minutos).\nAtual: ${minToHM(current)} (${current} min).\n\nDigite o valor correto em minutos:`, String(current));
        if(input === null) return; // cancelado
        const newMinutes = Number(input);
        if(!Number.isFinite(newMinutes) || newMinutes < 0){
          alert('Digite um número válido de minutos (0 ou mais).');
          return;
        }
        btn.disabled = true; btn.textContent = 'Salvando...';
        await setPrayerTotal(name, newMinutes);
        overview = await loadAdminOverview();
        renderBody();
      });
    });

    body.querySelectorAll('[data-reset]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const name = btn.dataset.reset;
        if(!confirm(`Resetar a senha de ${name}? Os alvos e o tempo de oração dela continuam salvos normalmente — ela só vai precisar criar uma senha nova no próximo acesso.`)) return;
        btn.disabled = true; btn.textContent = 'Resetando...';
        await resetCredential(name);
        btn.textContent = 'Senha resetada ✓';
      });
    });
  }

  loadAdminOverview().then(o => {
    overview = o;
    renderBody();
  }).catch(() => {
    card.querySelector('#adminBody').innerHTML = `<div class="msg err">Não foi possível carregar o painel agora.</div>`;
  });

  const discFilterEl2 = card.querySelector('#discipuladorFilter');
  if(discFilterEl2) discFilterEl2.addEventListener('change', () => { if(overview) renderBody(); });
  card.querySelector('#adminSearch').addEventListener('input', () => { if(overview) renderBody(); });

  return card;
}

render();
</script>
</body>
</html>
